[package]
name = "merkle"
version = "0.1.0"
description = "Allocation-free SHA-256 Merkle trees for Motoko: Bitcoin, bagged and zero-padded roots, proofs and chunked verification, built as Merkle mountain ranges"
repository = "https://github.com/research-ag/merkle"
keywords = [ "merkle", "mmr", "sha256", "bitcoin", "ssz" ]
license = "Apache-2.0"
files = [ "src/**/*.mo" ]

[dependencies]
core = "2.7.1"
sha2 = "0.3.4"

[dev-dependencies]
bench-helper = "0.0.4"

[toolchain]
moc = "2.2.5"
wasmtime = "51.0.0"
pocket-ic = "16.1.0"
wasm-opt = "133"
mo-fmt = "0.5.0"

[optimize]
